"apse"><span class="sf-num">03</span>北侧后殿与放射状礼拜堂</button><button type="button" class="sf-part" data-part="nativity"><span class="sf-num">04</span>东侧诞生立面与四使徒钟塔</button><button type="button" class="sf-part" data-part="passion"><span class="sf-num">05</span>西侧受难立面与斜撑骨骼柱廊</button><button type="button" class="sf-part" data-part="glory"><span class="sf-num">06</span>南侧荣耀立面与正门柱厅</button><button type="button" class="sf-part" data-part="nave"><span class="sf-num">07</span>双曲面采光拱顶与高侧窗飞檐</button><button type="button" class="sf-part" data-part="evangelists"><span class="sf-num">08</span>四福音书塔与圣母十二芒星塔</button><button type="button" class="sf-part" data-part="christ"><span class="sf-num">09</span>耶稣基督中央主塔核心筒</button><button type="button" class="sf-part" data-part="cross"><span class="sf-num">10</span>172.5m 四臂琉璃十字架塔尖</button></div><span class="iso-caption">安东尼·高迪（Antoni Gaudí）将哥特式建筑的外置飞扶壁彻底内化为「逆悬链线（Inverted Catenary）」纯受压轴线：中殿 12 根双螺旋分叉树状石柱按抛物线倾角精准分担来自 45–60 m 双曲面采光拱顶、四座 135 m 福音书作者塔、138 m 圣母玛利亚塔及 172.5 m 耶稣基督中央主塔的 185 MN 重力荷载；东侧诞生立面、西侧受难立面与南侧荣耀立面共立 12 座门徒钟塔，形成由下至上逐级收分的力学有机体。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);

    const share = state.x;
    const tx = (D.EX[0] * node.m[0] + D.EY[0] * node.m[1] + D.EZ[0] * node.m[2]) * share + state.dx;
    const ty = (D.EX[1] * node.m[0] + D.EY[1] * node.m[1] + D.EZ[1] * node.m[2]) * share + state.dy;
    const text = Math.abs(tx) < 0.02 && Math.abs(ty) < 0.02 ? "" : `translate(${tx.toFixed(2)} ${ty.toFixed(2)})`;
    if (text !== node.shown) {
      node.shown = text;
      if (text) node.el.setAttribute("transform", text);
      else node.el.removeAttribute("transform");
    }
  }

  const next = nodes
    .map((_, index) => index)
    .sort((a, b) => {
      const na = nodes[a];
      const nb = nodes[b];
      const ka = na.key + na.lift * piece[na.ride].x;
      const kb = nb.key + nb.lift * piece[nb.ride].x;
      return ka - kb;
    });
  if (next.some((index, at) => index !== order[at])) {
    const fragment = document.createDocumentFragment();
    for (const index of next) fragment.appendChild(nodes[index].el);
    scene.appendChild(fragment);
    order = next;
  }

  if (carriageEl) {
    const travel = masterPos * D.carriageSpan;
    carriageEl.setAttribute("transform", translateAlong(D.P, [travel, 0, 0]));
  }
  if (needleEl) {
    const loadTurn = clamp(1 - masterPos * 0.85, 0.06, 1);
    needleEl.setAttribute("d", needleAt(loadTurn));
  }
  updateUI();
}

function tourStep(dt) {
  tourClock += dt;
  if (tourClock < 0) return;
  const cycle = tourClock % 18;
  if (cycle < 1.8) {
    if (masterTarget !== 0) setMasterExplode(0, true);
    select(null);
  } else if (cycle < 5.5) {
    if (masterTarget !== 1) setMasterExplode(1, true);
    select("cross");
  } else if (cycle < 8.5) {
    select("christ");
  } else if (cycle < 11.5) {
    select("columns");
  } else if (cycle < 14.5) {
    select("nativity");
  } else {
    if (masterTarget !== 0) setMasterExplode(0, true);
    select(null);
  }
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  clock += dt;
  const calm = still.matches;

  if (touring && !calm) {
    tourStep(dt);
  }

  let moving = false;
  for (const id of IDS) {
    if (steerSpring(piece[id], dt, calm)) moving = true;
  }
  place();

  const settled = !touring && !moving;
  frame = visible && !settled ? requestAnimationFrame(tick) : 0;
}

function run() {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
}

function pauseTour() {
  touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (!still.matches && !dragging) {
      touring = true;
      tourClock = masterPos > 0.5 ? 5.5 : 0;
      run();
    }
  }, 6500);
}

new IntersectionObserver(
  (entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    if (visible) run();
  },
  { rootMargin: "120px 0px" }
).observe(stage);

let dragging = null;

stage.addEventListener("pointerdown", (event) => {
  if (event.button !== 0) return;
  pauseTour();
  const hitEl = event.target.closest(".it");
  const hitPiece = hitEl ? hitEl.dataset.piece : null;
  const box = svg.getBoundingClientRect();
  const scaleX = D.W / (box.width || D.W);
  const scaleY = D.H / (box.height || D.H);

  const singleMode = freeDragMode || event.shiftKey;
  if (singleMode && hitPiece && hitPiece !== "stand") {
    select(hitPiece);
    dragging = {
      kind: "single",
      id: hitPiece,
      startX: event.clientX,
      startY: event.clientY,
      origTx: piece[hitPiece].tx,
      origTy: piece[hitPiece].ty,
      origTarget: piece[hitPiece].target,
      scaleX,
      scaleY,
      moved: false,
    };
  } else {
    if (hitPiece && hitPiece !== "stand") select(hitPiece);
    dragging = {
      kind: "scrub",
      hitPiece,
      startX: event.clientX,
      startY: event.clientY,
      startMaster: masterPos,
      boxWidth: box.width || D.W,
      boxHeight: box.height || D.H,
      moved: false,
    };
  }
  stage.setAttribute("data-dragging", "");
  stage.setPointerCapture(event.pointerId);
  run();
});

stage.addEventListener("pointermove", (event) => {
  if (!dragging) {
    const hitEl = event.target.closest(".it");
    const hitPiece = hitEl ? hitEl.dataset.piece : null;
    if (hitPiece && hitPiece !== "stand" && !touring) {
      select(hitPiece);
    }
    return;
  }
  const dx = event.clientX - dragging.startX;
  const dy = event.clientY - dragging.startY;
  if (Math.hypot(dx, dy) > 4) dragging.moved = true;
  if (!dragging.moved) return;

  if (dragging.kind === "single") {
    const st = piece[dragging.id];
    st.pending = null;
    st.tx = dragging.origTx + dx * dragging.scaleX;
    st.ty = dragging.origTy + dy * dragging.scaleY;
    run();
  } else {
    const delta = dx / (dragging.boxWidth * 0.42) - dy / (dragging.boxHeight * 0.48);
    setMasterExplode(dragging.startMaster + delta, false);
  }
});

function endDrag(event) {
  if (!dragging) return;
  const wasMoved = dragging.moved;
  const hitPiece = dragging.hitPiece || dragging.id;
  stage.removeAttribute("data-dragging");
  if (stage.hasPointerCapture(event.pointerId)) {
    stage.releasePointerCapture(event.pointerId);
  }
  dragging = null;
  if (!wasMoved) {
    if (hitPiece && hitPiece !== "stand") {
      select(selected === hitPiece ? null : hitPiece);
      if (masterTarget < 0.25) setMasterExplode(1, true);
    } else {
      setMasterExplode(masterTarget > 0.5 ? 0 : 1, true);
    }
  }
}

stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);

if (slider) {
  slider.addEventListener("input", () => {
    pauseTour();
    const share = Number(slider.value) / 100;
    setMasterExplode(share, false);
  });
}

if (explodeBtn) {
  explodeBtn.addEventListener("click", () => {
    pauseTour();
    const next = masterTarget > 0.5 ? 0 : 1;
    setMasterExplode(next, true);
    announce(next ? "圣家族教堂已完全拆解展开" : "圣家族教堂已复位合拢");
  });
}

if (modeBtn) {
  modeBtn.addEventListener("click", () => {
    pauseTour();
    freeDragMode = !freeDragMode;
    if (freeDragMode && masterTarget < 0.2) {
      setMasterExplode(0.55, true);
    }
    updateUI();
    announce(freeDragMode ? "已切换为单件自由拖拽模式" : "已切换为整体联动拆解模式");
  });
}

if (themeBtn) {
  themeBtn.addEventListener("click", () => {
    const wrapper = document.querySelector(".iso");
    if (!wrapper) return;
    const isLight = wrapper.getAttribute("data-theme") === "light";
    if (isLight) wrapper.removeAttribute("data-theme");
    else wrapper.setAttribute("data-theme", "light");
  });
}

partButtons.forEach((button) => {
  button.addEventListener("click", () => {
    pauseTour();
    const id = button.dataset.part;
    if (selected === id && masterTarget > 0.5) {
      select(null);
    } else {
      select(id);
      if (masterTarget < 0.35) setMasterExplode(1, true);
    }
  });
  button.addEventListener("pointerenter", () => {
    if (!touring && !dragging) {
      select(button.dataset.part);
    }
  });
});

stage.addEventListener("keydown", (event) => {
  pauseTour();
  const idx = selected ? D.order.indexOf(selected) : -1;
  if (event.key === "ArrowRight" || event.key === "ArrowDown") {
    event.preventDefault();
    if (masterTarget < 0.3) setMasterExplode(1, true);
    select(D.order[(idx + 1) % D.order.length]);
  } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
    event.preventDefault();
    if (masterTarget < 0.3) setMasterExplode(1, true);
    select(D.order[(idx - 1 + D.order.length) % D.order.length]);
  } else if (event.key === " " || event.key === "Enter" || event.key === "e" || event.key === "E") {
    event.preventDefault();
    setMasterExplode(masterTarget > 0.5 ? 0 : 1, true);
  } else if (event.key === "d" || event.key === "D") {
    event.preventDefault();
    freeDragMode = !freeDragMode;
    updateUI();
  } else if (event.key === "Escape") {
    event.preventDefault();
    select(null);
    setMasterExplode(0, true);
  }
});

place();
</script></body></html>
